# ---------------------------------------------------------------------------
# merge sort visualiser - Test & Deploy pipeline
# Managed by DeployCraft. Regenerated on every change.
#
# I built a fully functional Merge Sort visualiser as a static web app with responsive dark theme, interactive…
#
# Every push runs the Playwright suite in tests/. Commits reach GitHub Pages only
# when the suite passes on main. This build verifies:
#   - applies custom array correctly
#   - sorting completes fast-forward
#   - step mode increments comparisons
#   - invalid input shows error
#   - reset restores original order
#   - page loads without console errors
# ---------------------------------------------------------------------------
name: Test & Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Static checks
        run: |
          test -f index.html || { echo "::error file=index.html::index.html is missing from the repository root"; exit 1; }
          if grep -RnE '(src|href)="/[^/]' --include='*.html' --exclude-dir=node_modules --exclude-dir=tests . ; then
            echo "::error::Root-absolute paths (src=\"/...\") break on GitHub Pages project sites. Use relative paths."
            exit 1
          fi
          echo "Static checks passed"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '.deploycraft' \
            --exclude 'tests' --exclude 'node_modules' --exclude '_site' \
            --exclude 'package.json' --exclude 'package-lock.json' --exclude 'playwright.config.js'
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
